<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 55)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="32" fill="#ffffff">
      CareerDost
    </text>
    
    <!-- Category Pill -->
    <rect x="890" y="-22" width="190" height="40" rx="20" fill="#0d9488"/>
    <text x="985" y="4" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">
      PAID INTERNSHIP 2026
    </text>
  </g>

  <!-- Deadline Badge -->
  <g transform="translate(60, 135)">
    <rect width="520" height="48" rx="8" fill="url(#goldGrad)"/>
    <text x="260" y="31" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="20" fill="#134e4a" text-anchor="middle" letter-spacing="1">
      🌟 3-MONTH PAID INTERNSHIP PROGRAM
    </text>
  </g>

  <!-- Center Content -->
  <g transform="translate(60, 230)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="24" fill="#99f6e4" letter-spacing="1">
      PUNJAB CENTRAL BUSINESS DISTRICT (PCBDDA)
    </text>

    <text y="70" font-family="'Georgia', serif" font-weight="800" font-size="42" fill="#ffffff">
      Punjab CBD Youth Career Program 2026
    </text>

    <rect y="120" width="650" height="48" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="25" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#ffffff">
      Engineering, HR, IT, Finance, Legal, Audit &amp; Architecture
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 575)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#99f6e4">
      Eligibility: Fresh Graduates (16 Yrs Education, 3.0 CGPA, Age ≤ 25)
    </text>
    <text x="1080" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="16" fill="#fbbf24" text-anchor="end">
      Deadline: 12 October 2026
    </text>
  </g>
</svg>
