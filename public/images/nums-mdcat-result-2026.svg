<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad_nums-mdcat-result-2026" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <pattern id="grid_nums-mdcat-result-2026" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad_nums-mdcat-result-2026)"/>
  <rect width="1200" height="675" fill="url(#grid_nums-mdcat-result-2026)"/>

  <!-- Top Decorative Bar -->
  <g transform="translate(60, 60)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-0.5">
      CareerDost.com
    </text>
    
    <!-- Category Pill -->
    <rect x="800" y="-22" width="280" height="44" rx="22" fill="#2563eb"/>
    <text x="940" y="6" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">
      Results / Exams
    </text>
  </g>

  <!-- Center Content -->
  <g transform="translate(60, 180)">
    <!-- Organization -->
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="19" fill="#60a5fa" letter-spacing="1.5">
      NATIONAL UNIVERSITY OF MEDICAL SCIENCES (NUMS)
    </text>

    <!-- Main Title -->
    <text y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="48" fill="#ffffff">
      NUMS MDCAT Result 2026
    </text>

    <!-- Sub Heading -->
    <text y="130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="32" fill="#60a5fa">
      Result Announced
    </text>

    <!-- Subtitle Badge -->
    <rect y="170" width="820" height="54" rx="10" fill="rgba(96, 165, 250, 0.15)" stroke="rgba(96, 165, 250, 0.5)" stroke-width="1.5"/>
    <text x="24" y="204" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="20" fill="#dbeafe">
      Check Online at mdcat.numspak.edu.pk • Download Result Card
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 560)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <text y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600" font-size="18" fill="rgba(255,255,255,0.85)">
      MBBS &amp; BDS Admissions Next Steps • Official NUMS Portal
    </text>
    
    <text x="1080" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="18" fill="#60a5fa" text-anchor="end">
      Result Declared: Official Portal Live
    </text>
  </g>
