<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 55)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="32" fill="#ffffff">
      CareerDost
    </text>
    
    <!-- Category Pill -->
    <rect x="890" y="-22" width="190" height="40" rx="20" fill="#7c3aed"/>
    <text x="985" y="4" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">
      HEC RESEARCH 2026
    </text>
  </g>

  <!-- Deadline Badge -->
  <g transform="translate(60, 135)">
    <rect width="570" height="48" rx="8" fill="url(#goldGrad)"/>
    <text x="285" y="31" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="20" fill="#4c1d95" text-anchor="middle" letter-spacing="1">
      ⏳ DEADLINE TOMORROW: 30 SEPT 2026 (16:00 PST)
    </text>
  </g>

  <!-- Center Content -->
  <g transform="translate(60, 230)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="24" fill="#ddd6fe" letter-spacing="1">
      HEC &amp; CAMPUS FRANCE COLLABORATION
    </text>

    <text y="70" font-family="'Georgia', serif" font-weight="800" font-size="40" fill="#ffffff">
      PERIDOT Research Program Phase XIII
    </text>

    <rect y="120" width="650" height="48" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="25" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#ffffff">
      Franco-Pakistani Joint Scientific Research &amp; Mobility Grants
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 575)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#fde68a">
      Health Sciences • Climate Economics • Sustainable Agriculture &amp; Energy
    </text>
    <text x="1080" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="end">
      Verified Official Notice • CareerDost
    </text>
  </g>
</svg>
