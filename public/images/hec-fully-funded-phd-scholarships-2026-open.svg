<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad_hec_fully_funded_phd_scholarships_2026_open" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <pattern id="grid_hec_fully_funded_phd_scholarships_2026_open" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad_hec_fully_funded_phd_scholarships_2026_open)"/>
  <rect width="1200" height="675" fill="url(#grid_hec_fully_funded_phd_scholarships_2026_open)"/>

  <!-- Top Bar -->
  <g transform="translate(60, 60)">
    <text font-family="'Georgia', serif" font-weight="700" font-size="34" fill="#ffffff">
      CareerDost
    </text>
    <text x="180" y="-3" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="14" fill="#d4af37">
      • Pakistan Career Portal
    </text>

    <!-- Category Pill -->
    <rect x="840" y="-22" width="240" height="42" rx="21" fill="#0d9488"/>
    <text x="960" y="5" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">
      Scholarships
    </text>
  </g>

  <!-- Center Content -->
  <g transform="translate(60, 200)">
    <!-- Organization -->
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="20" fill="#5eead4" letter-spacing="1">
      HIGHER EDUCATION COMMISSION (HEC) PAKISTAN
    </text>

    <!-- Title -->
    <text y="75" font-family="'Georgia', serif" font-weight="800" font-size="42" fill="#ffffff">
      HEC Overseas PhD Scholarships 2026
    </text>

    <!-- Subtitle Badge -->
    <rect y="125" width="880" height="52" rx="8" fill="rgba(94, 234, 212, 0.15)" stroke="rgba(94, 234, 212, 0.5)" stroke-width="1.5"/>
    <text x="24" y="158" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#ccfbf1">
      Fully Funded • Tuition, Living Stipend &amp; Airfare Included
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 560)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    
    <text y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="18" fill="rgba(255,255,255,0.9)">
      Apply Online via HEC E-Portal: eportal.hec.gov.pk
    </text>

    <text x="1080" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#5eead4" text-anchor="end">
      Deadline: 30 October 2026
    </text>
  </g>
</svg>