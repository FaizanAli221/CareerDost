<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 55)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="32" fill="#ffffff">
      CareerDost
    </text>
    
    <!-- Category Pill -->
    <rect x="910" y="-22" width="170" height="40" rx="20" fill="#10b981"/>
    <text x="995" y="4" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">
      PAKISTAN UPDATES
    </text>
  </g>

  <!-- Main Headline Badge -->
  <g transform="translate(60, 135)">
    <rect width="480" height="46" rx="8" fill="url(#accentGrad)"/>
    <text x="240" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="22" fill="#064e3b" text-anchor="middle" letter-spacing="1.5">
      🚨 PETROL PRICE REDUCED
    </text>
  </g>

  <!-- Fuel Price Reduction Stat Cards -->
  <g transform="translate(60, 220)">
    <!-- Petrol Card -->
    <rect width="520" height="240" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2"/>
    <text x="40" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="24" fill="#a7f3d0">
      PETROL (SUPER)
    </text>
    <text x="40" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#34d399">
      Petrol ↓ Rs2.27
    </text>
    <text x="40" y="175" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">
      New Petrol Price: Rs389.03/L
    </text>

    <!-- Diesel Card -->
    <g transform="translate(560, 0)">
      <rect width="520" height="240" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(251, 191, 36, 0.3)" stroke-width="2"/>
      <text x="40" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="24" fill="#fde68a">
        HIGH-SPEED DIESEL (HSD)
      </text>
      <text x="40" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#fbbf24">
        Diesel ↓ Rs3.56
      </text>
      <text x="40" y="175" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">
        New HSD Price: Rs404.97/L
      </text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 575)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <text y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#a7f3d0">
      🗓️ Effective Date: September 29, 2026
    </text>
    
    <text x="1080" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="end">
      Verified Official Notification • CareerDost
    </text>
  </g>
</svg>
