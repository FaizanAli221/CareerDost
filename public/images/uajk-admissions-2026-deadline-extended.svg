<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top Bar -->
  <g transform="translate(60, 60)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="32" fill="#ffffff">
      CareerDost
    </text>
    
    <!-- Urgent Alert Pill -->
    <rect x="800" y="-22" width="280" height="42" rx="21" fill="#e11d48"/>
    <text x="940" y="5" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">
      ⚠️ URGENT DEADLINE ALERT
    </text>
  </g>

  <!-- Center Content -->
  <g transform="translate(60, 190)">
    <!-- Organization -->
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="22" fill="#fda4af" letter-spacing="1">
      UNIVERSITY OF AZAD JAMMU &amp; KASHMIR (UAJK)
    </text>

    <!-- Title -->
    <text y="80" font-family="'Georgia', serif" font-weight="800" font-size="52" fill="#ffffff">
      UAJK Admissions 2026
    </text>

    <!-- Subtitle Badge -->
    <rect y="135" width="560" height="52" rx="8" fill="#e11d48" stroke="#ffe4e6" stroke-width="1"/>
    <text x="24" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff">
      LAST DATE TOMORROW
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 560)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <text y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="18" fill="rgba(255,255,255,0.85)">
      Verified Official Extension • CareerDost
    </text>
    
    <text x="1080" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="22" fill="#fda4af" text-anchor="end">
      Last Date: 5 October
    </text>
  </g>
</svg>
